<rect x="258" y="182" width="32" height="26" rx="3" fill="#1C5785"/>
<text x="404" y="202" font-size="20" fill="#146C67" font-weight="800" text-anchor="end" data-box="20,176,400,38">309</text>
<rect x="20" y="218" width="400" height="38" rx="8" fill="#F4F6F8"/>
<text x="30" y="243" font-size="18" fill="#1A1D21" font-weight="700" data-box="20,218,400,38">Smaller containers</text>
<rect x="226" y="228" width="24" height="18" rx="3" fill="none" stroke="#7D8691" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="258" y="224" width="32" height="26" rx="3" fill="#1C5785"/>
<text x="404" y="244" font-size="20" fill="#8A5A0C" font-weight="800" text-anchor="end" data-box="20,218,400,38">112</text>
