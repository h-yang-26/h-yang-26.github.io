<path d="M122 248 L122 272" fill="none" stroke="#848D98" stroke-width="2" marker-end="url(#m-line)"/>
<path d="M220 198 L236 198" fill="none" stroke="#848D98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-line)"/>
<rect x="240" y="146" width="156" height="104" rx="10" fill="#22272C" stroke="#848D98" stroke-width="1.5" stroke-dasharray="6 4"/>
