<text x="254" y="216.6" font-size="16" fill="#A9AEB5" data-box="240,146,156,104">signal only</text>
<rect x="24" y="276" width="196" height="100" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="38" y="305.2" font-size="16" fill="#8CC0EA" font-weight="700" data-box="24,276,196,100">ORDERS</text>
<text x="38" y="330.2" font-size="19" fill="#E9E7E2" font-weight="700" data-box="24,276,196,100">Sales order</text>
<text x="38" y="355.2" font-size="16" fill="#A9AEB5" data-box="24,276,196,100">2 units committed</text>
