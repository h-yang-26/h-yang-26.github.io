<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 594" width="420" height="594" role="img" aria-labelledby="t">
<title id="t">Each business fact has one owning module</title>
<defs>
<marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#848D98"/></marker>
</defs>
<rect width="420" height="594" fill="#191C1F"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect x="24" y="20" width="196" height="100" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="38" y="49.2" font-size="16" fill="#8CC0EA" font-weight="700" data-box="24,20,196,100">CRM</text>
<text x="38" y="74.2" font-size="19" fill="#E9E7E2" font-weight="700" data-box="24,20,196,100">Opportunity</text>
<text x="38" y="99.2" font-size="16" fill="#A9AEB5" data-box="24,20,196,100">qualified lead</text>
