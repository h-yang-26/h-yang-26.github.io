<rect x="24" y="148" width="196" height="100" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="38" y="177.2" font-size="16" fill="#8CC0EA" font-weight="700" data-box="24,148,196,100">QUOTATION</text>
