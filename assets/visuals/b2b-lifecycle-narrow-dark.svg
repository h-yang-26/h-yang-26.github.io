<path d="M220 326 L236 326" fill="none" stroke="#848D98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-line)"/>
<rect x="240" y="274" width="156" height="104" rx="10" fill="#22272C" stroke="#848D98" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="254" y="301.6" font-size="17" fill="#E9E7E2" font-weight="700" data-box="240,274,156,104">Still owed</text>
