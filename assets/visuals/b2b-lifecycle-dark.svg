<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t">
<title id="t">Each business fact has one owning module</title>
<defs>
<marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#848D98"/></marker>
</defs>
<rect width="760" height="330" fill="#191C1F"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect x="24" y="24" width="160" height="112" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="38" y="52.4" font-size="15" fill="#8CC0EA" font-weight="700" data-box="24,24,160,112">CRM</text>
<text x="38" y="75.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="24,24,160,112">Opportunity</text>
<text x="38" y="98.4" font-size="15" fill="#A9AEB5" data-box="24,24,160,112">qualified lead</text>
<rect x="212" y="24" width="160" height="112" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="226" y="52.4" font-size="15" fill="#8CC0EA" font-weight="700" data-box="212,24,160,112">QUOTATION</text>
<text x="226" y="75.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="212,24,160,112">Quote</text>
<text x="226" y="98.4" font-size="15" fill="#A9AEB5" data-box="212,24,160,112">4 units offered</text>
<rect x="400" y="24" width="160" height="112" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="414" y="52.4" font-size="15" fill="#8CC0EA" font-weight="700" data-box="400,24,160,112">ORDERS</text>
<text x="414" y="75.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="400,24,160,112">Sales order</text>
<text x="414" y="98.4" font-size="15" fill="#A9AEB5" data-box="400,24,160,112">2 units committed</text>
<rect x="588" y="24" width="160" height="112" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="602" y="52.4" font-size="15" fill="#8CC0EA" font-weight="700" data-box="588,24,160,112">FULFILLMENT</text>
<text x="602" y="75.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="588,24,160,112">Shipment</text>
<text x="602" y="98.4" font-size="15" fill="#A9AEB5" data-box="588,24,160,112">1 unit shipped</text>
<path d="M184 80 L208 80" fill="none" stroke="#848D98" stroke-width="2" marker-end="url(#m-line)"/>
<path d="M372 80 L396 80" fill="none" stroke="#848D98" stroke-width="2" marker-end="url(#m-line)"/>
<path d="M560 80 L584 80" fill="none" stroke="#848D98" stroke-width="2" marker-end="url(#m-line)"/>
<path d="M292 136 L292 176" fill="none" stroke="#848D98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-line)"/>
<rect x="212" y="180" width="180" height="92" rx="10" fill="#22272C" stroke="#848D98" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="226" y="208.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="212,180,180,92">Not converted</text>
<text x="226" y="231.4" font-size="15" fill="#A9AEB5" data-box="212,180,180,92">2 units: a quote</text>
<text x="226" y="251.4" font-size="15" fill="#A9AEB5" data-box="212,180,180,92">signal, not demand</text>
<path d="M480 136 L480 176" fill="none" stroke="#848D98" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-line)"/>
<rect x="404" y="180" width="192" height="92" rx="10" fill="#22272C" stroke="#848D98" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="418" y="208.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="404,180,192,92">Still owed</text>
<text x="418" y="231.4" font-size="15" fill="#A9AEB5" data-box="404,180,192,92">2 ordered − 1 shipped</text>
<text x="418" y="251.4" font-size="15" fill="#A9AEB5" data-box="404,180,192,92">= 1 unit</text>
<text x="24" y="314" font-size="15" fill="#A9AEB5">Small capitals name the module that owns each fact. Dashed: derived or uncommitted.</text>
</g></svg>
