<text x="40" y="464" font-size="17" fill="#4F5660" font-weight="600" data-box="20,148,380,330">Optimal at the original shortage cost</text>
<rect x="20" y="494" width="380" height="330" rx="14" fill="#FFFFFF" stroke="#7D8691" stroke-width="1.5"/>
