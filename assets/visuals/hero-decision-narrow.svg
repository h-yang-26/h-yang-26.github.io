<text x="42" y="906" font-size="16" fill="#1C5785" font-weight="800" letter-spacing="1.2" data-box="20,876,380,98">BUSINESS CONTEXT</text>
<text x="42" y="934" font-size="18" fill="#1A1D21" font-weight="600" data-box="20,876,380,98">What is a unit of</text>
<text x="42" y="958" font-size="18" fill="#1A1D21" font-weight="600" data-box="20,876,380,98">unmet demand worth?</text>
<rect x="20" y="986" width="380" height="98" rx="12" fill="#F4F6F8"/>
<rect x="20" y="986" width="6" height="98" rx="3" fill="#146C67"/>
<text x="42" y="1016" font-size="16" fill="#146C67" font-weight="800" letter-spacing="1.2" data-box="20,986,380,98">MODEL</text>
<text x="42" y="1044" font-size="18" fill="#1A1D21" font-weight="600" data-box="20,986,380,98">Capacity is a hard</text>
<text x="42" y="1068" font-size="18" fill="#1A1D21" font-weight="600" data-box="20,986,380,98">limit in both plans.</text>
<rect x="20" y="1096" width="380" height="98" rx="12" fill="#F4F6F8"/>
<rect x="20" y="1096" width="6" height="98" rx="3" fill="#8A5A0C"/>
<text x="42" y="1126" font-size="16" fill="#8A5A0C" font-weight="800" letter-spacing="1.2" data-box="20,1096,380,98">ASSUMPTION</text>
<text x="42" y="1154" font-size="18" fill="#1A1D21" font-weight="600" data-box="20,1096,380,98">The shortage cost is a</text>
<text x="42" y="1178" font-size="18" fill="#1A1D21" font-weight="600" data-box="20,1096,380,98">judgment, not a fact.</text>
<rect x="20" y="1206" width="380" height="104" rx="12" fill="#EAF1F7" stroke="#1C5785" stroke-width="2"/>
<text x="42" y="1240" font-size="23" fill="#1A1D21" font-weight="800" data-box="20,1206,380,104">Preferred plan depends</text>
<text x="42" y="1270" font-size="23" fill="#1A1D21" font-weight="800" data-box="20,1206,380,104">on the shortage cost.</text>
<text x="42" y="1296" font-size="16" fill="#4F5660" font-weight="600" data-box="20,1206,380,104">Fictional scenarios · not a loading plan</text></g></svg>
