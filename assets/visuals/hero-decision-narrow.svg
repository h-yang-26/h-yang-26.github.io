<text x="40" y="810" font-size="17" fill="#4F5660" font-weight="600" data-box="20,494,380,330">Optimal when shortages cost 4× more</text>
<text x="20" y="862" font-size="16" fill="#4F5660" font-weight="800" letter-spacing="1.2">THREE LENSES ON THE SAME DECISION</text>
<rect x="20" y="876" width="380" height="98" rx="12" fill="#F4F6F8"/>
