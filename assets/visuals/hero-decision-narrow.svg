<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1334" width="420" height="1334" role="img" aria-labelledby="t"><title id="t">Plan A opens one container and ships 112 of 309 units; Plan B opens both and ships 130. The preferred plan depends on the shortage cost.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7D8691"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A0C"/></marker></defs><rect width="420" height="1334" rx="20" fill="#F8F7F3"/><g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="20" y="44" font-size="16" fill="#1C5785" font-weight="800" letter-spacing="1.5">THE QUESTION</text>
