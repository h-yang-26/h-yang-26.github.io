<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="440" height="520" role="img" aria-labelledby="t"><title id="t">A late shipment has three possible causes; each has a test that would decide it.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#848D98"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E6B15C"/></marker></defs><rect width="440" height="520" rx="18" fill="#191C1F"/><g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="28" y="46" font-size="17" fill="#8CC0EA" font-weight="800" letter-spacing="1.2">CHOOSING UNDER UNCERTAINTY</text>
<text x="28" y="92" font-size="29" fill="#E9E7E2" font-weight="800" data-box="24,60,392,80">A shipment is late.</text>
<text x="28" y="128" font-size="29" fill="#E9E7E2" font-weight="800" data-box="24,60,392,80">Three causes fit.</text>
<text x="28" y="446" font-size="18" fill="#A9AEB5" data-box="24,424,392,86">The likeliest cause guides the next check,</text>
<text x="28" y="471" font-size="18" fill="#A9AEB5" data-box="24,424,392,86">but it stays a hypothesis until the</text>
<text x="28" y="496" font-size="18" fill="#A9AEB5" data-box="24,424,392,86">evidence settles it.</text>
<text x="28" y="164" font-size="17" fill="#A9AEB5" font-weight="700">Possible cause</text>
<text x="262" y="164" font-size="17" fill="#A9AEB5" font-weight="700">Test that decides</text>
<rect x="20" y="178" width="226" height="44" rx="10" fill="#33290F" stroke="#E6B15C" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="34" y="206" font-size="17" fill="#E9E7E2" font-weight="700" data-box="20,178,226,44">Supplier shipped late</text>
<path d="M250 200 L262 200" stroke="#848D98" stroke-width="2" marker-end="url(#ah)"/>
<rect x="268" y="178" width="152" height="44" rx="10" fill="#1D2A36"/>
<text x="282" y="206" font-size="17" fill="#8CC0EA" font-weight="700" data-box="268,178,152,44">ship date</text>
<rect x="20" y="232" width="226" height="44" rx="10" fill="#33290F" stroke="#E6B15C" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="34" y="260" font-size="17" fill="#E9E7E2" font-weight="700" data-box="20,232,226,44">Carrier was slow</text>
<path d="M250 254 L262 254" stroke="#848D98" stroke-width="2" marker-end="url(#ah)"/>
<rect x="268" y="232" width="152" height="44" rx="10" fill="#1D2A36"/>
<text x="282" y="260" font-size="17" fill="#8CC0EA" font-weight="700" data-box="268,232,152,44">transit time</text>
<rect x="20" y="286" width="226" height="44" rx="10" fill="#33290F" stroke="#E6B15C" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="34" y="314" font-size="17" fill="#E9E7E2" font-weight="700" data-box="20,286,226,44">Wrong date on file</text>
<path d="M250 308 L262 308" stroke="#848D98" stroke-width="2" marker-end="url(#ah)"/>
<rect x="268" y="286" width="152" height="44" rx="10" fill="#1D2A36"/>
<text x="282" y="314" font-size="17" fill="#8CC0EA" font-weight="700" data-box="268,286,152,44">order history</text>
<rect x="64" y="352" width="312" height="52" rx="26" fill="#8CC0EA"/>
<path d="M90 378 l6.6 6.6 l13.2 -14.3" fill="none" stroke="#101418" stroke-width="3.52" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="385" font-size="18" fill="#101418" font-weight="800" data-box="64,352,312,52">Run the deciding test</text></g></svg>
