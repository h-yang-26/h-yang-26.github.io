<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-labelledby="t"><title id="t">Plan A opens one container and ships 112 of 309 units; Plan B opens both and ships 130. The preferred plan depends on the shortage cost.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#848D98"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E6B15C"/></marker></defs><rect width="1000" height="700" rx="20" fill="#111315"/><g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="32" y="44" font-size="16" fill="#8CC0EA" font-weight="800" letter-spacing="1.5">THE QUESTION</text>
<text x="32" y="78" font-size="28" fill="#E9E7E2" font-weight="800">What should ship now?</text>
<text x="968" y="56" font-size="17" fill="#A9AEB5" font-weight="600" text-anchor="end">Same tight containers and stock.</text>
<text x="968" y="80" font-size="17" fill="#A9AEB5" font-weight="600" text-anchor="end">Only the shortage cost changes.</text>
<rect x="32" y="104" width="454" height="330" rx="14" fill="#191C1F" stroke="#848D98" stroke-width="1.5"/>
<text x="52" y="138" font-size="16" fill="#8CC0EA" font-weight="800" letter-spacing="1.5">PLAN A</text>
<text x="52" y="168" font-size="21" fill="#E9E7E2" font-weight="800" data-box="32,104,454,330">Open one container</text>
<text x="52" y="194" font-size="17" fill="#A9AEB5" font-weight="600" data-box="32,104,454,330">Lower container cost</text>
<rect x="52" y="216" width="170" height="92" rx="6" fill="#6FCDC2" stroke="#6FCDC2" stroke-width="2.5"/>
<text x="137" y="268" font-size="16" fill="#101418" font-weight="800" text-anchor="middle">full</text>
<text x="52" y="330" font-size="16" fill="#A9AEB5" font-weight="600">large · 112 units</text>
<rect x="242" y="236" width="110" height="72" rx="6" fill="none" stroke="#848D98" stroke-width="2" stroke-dasharray="6 4"/>
<text x="242" y="330" font-size="16" fill="#A9AEB5" font-weight="600">small · not opened</text>
<rect x="52" y="350" width="414" height="16" rx="8" fill="#E6B15C"/>
<rect x="52" y="350" width="150" height="16" rx="8" fill="#6FCDC2"/>
<rect x="194" y="350" width="8" height="16" fill="#6FCDC2"/>
<text x="52" y="392" font-size="17" fill="#E9E7E2" font-weight="700">112 of 309 units ship</text>
<text x="466" y="392" font-size="17" fill="#E6B15C" font-weight="700" text-anchor="end">197 short</text>
<text x="52" y="420" font-size="17" fill="#A9AEB5" font-weight="600" data-box="32,104,454,330">Optimal at the original shortage cost</text>
<rect x="514" y="104" width="454" height="330" rx="14" fill="#191C1F" stroke="#848D98" stroke-width="1.5"/>
<text x="534" y="138" font-size="16" fill="#8CC0EA" font-weight="800" letter-spacing="1.5">PLAN B</text>
<text x="534" y="168" font-size="21" fill="#E9E7E2" font-weight="800" data-box="514,104,454,330">Open both containers</text>
<text x="534" y="194" font-size="17" fill="#A9AEB5" font-weight="600" data-box="514,104,454,330">Less unmet demand</text>
<rect x="534" y="216" width="170" height="92" rx="6" fill="#6FCDC2" stroke="#6FCDC2" stroke-width="2.5"/>
<text x="619" y="268" font-size="16" fill="#101418" font-weight="800" text-anchor="middle">full</text>
<text x="534" y="330" font-size="16" fill="#A9AEB5" font-weight="600">large · 117 units</text>
<rect x="724" y="236" width="110" height="72" rx="6" fill="#6FCDC2" stroke="#6FCDC2" stroke-width="2.5"/>
<text x="779" y="278" font-size="16" fill="#101418" font-weight="800" text-anchor="middle">full</text>
<text x="724" y="330" font-size="16" fill="#A9AEB5" font-weight="600">small · 13 units</text>
<rect x="534" y="350" width="414" height="16" rx="8" fill="#E6B15C"/>
<rect x="534" y="350" width="174" height="16" rx="8" fill="#6FCDC2"/>
<rect x="700" y="350" width="8" height="16" fill="#6FCDC2"/>
<text x="534" y="392" font-size="17" fill="#E9E7E2" font-weight="700">130 of 309 units ship</text>
<text x="948" y="392" font-size="17" fill="#E6B15C" font-weight="700" text-anchor="end">179 short</text>
<text x="534" y="420" font-size="17" fill="#A9AEB5" font-weight="600" data-box="514,104,454,330">Optimal when shortages cost 4× more</text>
<text x="32" y="474" font-size="16" fill="#A9AEB5" font-weight="800" letter-spacing="1.2">THREE LENSES ON THE SAME DECISION</text>
<rect x="32" y="488" width="301" height="98" rx="12" fill="#22272C"/>
<rect x="32" y="488" width="6" height="98" rx="3" fill="#8CC0EA"/>
<text x="54" y="518" font-size="16" fill="#8CC0EA" font-weight="800" letter-spacing="1.2" data-box="32,488,301,98">BUSINESS CONTEXT</text>
<text x="54" y="546" font-size="18" fill="#E9E7E2" font-weight="600" data-box="32,488,301,98">What is a unit of</text>
<text x="54" y="570" font-size="18" fill="#E9E7E2" font-weight="600" data-box="32,488,301,98">unmet demand worth?</text>
<rect x="349" y="488" width="301" height="98" rx="12" fill="#22272C"/>
<rect x="349" y="488" width="6" height="98" rx="3" fill="#6FCDC2"/>
<text x="371" y="518" font-size="16" fill="#6FCDC2" font-weight="800" letter-spacing="1.2" data-box="349,488,301,98">MODEL</text>
<text x="371" y="546" font-size="18" fill="#E9E7E2" font-weight="600" data-box="349,488,301,98">Capacity is a hard</text>
<text x="371" y="570" font-size="18" fill="#E9E7E2" font-weight="600" data-box="349,488,301,98">limit in both plans.</text>
<rect x="667" y="488" width="301" height="98" rx="12" fill="#22272C"/>
<rect x="667" y="488" width="6" height="98" rx="3" fill="#E6B15C"/>
<text x="689" y="518" font-size="16" fill="#E6B15C" font-weight="800" letter-spacing="1.2" data-box="667,488,301,98">ASSUMPTION</text>
<text x="689" y="546" font-size="18" fill="#E9E7E2" font-weight="600" data-box="667,488,301,98">The shortage cost is a</text>
<text x="689" y="570" font-size="18" fill="#E9E7E2" font-weight="600" data-box="667,488,301,98">judgment, not a fact.</text>
<rect x="32" y="602" width="936" height="74" rx="12" fill="#1D2A36" stroke="#8CC0EA" stroke-width="2"/>
<text x="54" y="636" font-size="23" fill="#E9E7E2" font-weight="800" data-box="32,602,936,74">Preferred plan depends on the shortage cost.</text>
<text x="54" y="662" font-size="16" fill="#A9AEB5" font-weight="600" data-box="32,602,936,74">Fictional scenarios from the shipping case study · an allocation is not a loading plan</text></g></svg>
