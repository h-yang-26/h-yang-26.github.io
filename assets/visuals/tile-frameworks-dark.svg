<text x="28" y="471" font-size="18" fill="#A9AEB5" data-box="24,424,392,86">whether the problem already has a</text>
<text x="28" y="496" font-size="18" fill="#A9AEB5" data-box="24,424,392,86">trusted method. This one does.</text>
