<text x="254" y="238" font-size="17" fill="#8CC0EA" font-weight="800" data-box="240,150,172,176">Known problem</text>
<text x="254" y="266" font-size="20" fill="#E9E7E2" font-weight="800" data-box="240,150,172,176">Fixed-charge</text>
