<text x="380" y="154" font-size="16" fill="#4F5660" text-anchor="middle">New evidence can reopen any earlier step.</text>
<text x="380" y="306" font-size="15" fill="#4F5660" text-anchor="middle">Reusable operations, not a guaranteed algorithm.</text>
