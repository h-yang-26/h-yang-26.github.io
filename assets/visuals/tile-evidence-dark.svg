<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="440" height="520" role="img" aria-labelledby="t"><title id="t">03/04/2024 could be March 4 or April 3, so it is rejected rather than guessed.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#848D98"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E6B15C"/></marker></defs><rect width="440" height="520" rx="18" fill="#191C1F"/><g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="28" y="46" font-size="17" fill="#8CC0EA" font-weight="800" letter-spacing="1.2">EXAMINING EVIDENCE</text>
<text x="28" y="92" font-size="29" fill="#E9E7E2" font-weight="800" data-box="24,60,392,80">Is 03/04/2024 in</text>
<text x="28" y="128" font-size="29" fill="#E9E7E2" font-weight="800" data-box="24,60,392,80">March or April?</text>
<text x="28" y="446" font-size="18" fill="#A9AEB5" data-box="24,424,392,86">Read the wrong way, a date moves by</text>
<text x="28" y="471" font-size="18" fill="#A9AEB5" data-box="24,424,392,86">about a month and nobody notices. Only</text>
<text x="28" y="496" font-size="18" fill="#A9AEB5" data-box="24,424,392,86">YYYY-MM-DD dates are accepted.</text>
