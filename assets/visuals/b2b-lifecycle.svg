<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="t d"><title id="t">Business facts have different owners</title><desc id="d">A fictional lifecycle illustrates how quoted, ordered and shipped units differ in business meaning.</desc><rect x="0" y="0" width="1000" height="475" rx="0" fill="#F5F8FB" stroke="#F5F8FB" stroke-width="1.5"/><rect x="0" y="0" width="1000" height="8" rx="3" fill="#23628D"/><text x="39" y="35" fill="#167D78" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start">01 / B2B SYSTEMS</text><text x="39" y="78" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" text-anchor="start">Business facts have different owners</text><rect x="34" y="160" width="202" height="117" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="34" y="160" width="5" height="117" rx="3" fill="#23628D"/><text x="51" y="198" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Lead / CRM</text><text x="51" y="225" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">customer inquiry</text><rect x="272" y="160" width="203" height="117" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="272" y="160" width="5" height="117" rx="3" fill="#23628D"/><text x="289" y="198" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Quotation</text><text x="289" y="225" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">4 units offered</text><rect x="509" y="160" width="210" height="117" rx="12" fill="#FFFFFF" stroke="#167D78" stroke-width="1.5"/><rect x="509" y="160" width="5" height="117" rx="3" fill="#167D78"/><text x="526" y="198" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Sales order</text><text x="526" y="225" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">2 committed units</text><rect x="755" y="160" width="213" height="117" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="755" y="160" width="5" height="117" rx="3" fill="#23628D"/><text x="772" y="198" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Fulfillment</text><text x="772" y="225" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">reserve → ship 1</text><path d="M236 219 L265 219" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M256 214 L265 219 L256 224" fill="none" stroke="#23628D" stroke-width="2.5" stroke-linecap="round"/><path d="M475 219 L502 219" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M493 214 L502 219 L493 224" fill="none" stroke="#23628D" stroke-width="2.5" stroke-linecap="round"/><path d="M719 219 L747 219" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M738 214 L747 219 L738 224" fill="none" stroke="#23628D" stroke-width="2.5" stroke-linecap="round"/><rect x="272" y="326" width="203" height="89" rx="12" fill="#FFFFFF" stroke="#AA721D" stroke-width="1.5"/><rect x="272" y="326" width="5" height="89" rx="3" fill="#AA721D"/><text x="289" y="364" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Not converted</text><text x="289" y="391" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">2 quote-only units</text><rect x="755" y="326" width="213" height="89" rx="12" fill="#FFFFFF" stroke="#AA721D" stroke-width="1.5"/><rect x="755" y="326" width="5" height="89" rx="3" fill="#AA721D"/><text x="772" y="364" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Open order</text><text x="772" y="391" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">1 unit still owed</text><path d="M373 277 L373 319" fill="none" stroke="#AA721D" stroke-width="3" stroke-linecap="round"/><path d="M859 277 L859 319" fill="none" stroke="#AA721D" stroke-width="3" stroke-linecap="round"/><text x="40" y="132" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">A quotation is not committed demand; reservation is not shipment.</text><path d="M40 428 L960 428" fill="none" stroke="#D7E3ED" stroke-width="3" stroke-linecap="round"/><text x="40" y="455" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Hypothetical design only — not an employer's deployed architecture.</text></svg>
