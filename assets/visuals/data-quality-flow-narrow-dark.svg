<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 556" width="420" height="556" role="img" aria-labelledby="t">
<title id="t">Fictional CSV rows are checked and routed to accepted records or human review</title>
<defs>
<marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#848D98"/></marker>
<marker id="m-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6FCDC2"/></marker>
<marker id="m-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E6B15C"/></marker>
</defs>
<rect width="420" height="556" fill="#191C1F"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect x="24" y="20" width="372" height="92" rx="10" fill="#22272C" stroke="#848D98" stroke-width="1.5"/>
<text x="38" y="49.2" font-size="19" fill="#E9E7E2" font-weight="700" data-box="24,20,372,92">Source CSV</text>
<text x="38" y="74.2" font-size="16" fill="#A9AEB5" data-box="24,20,372,92">60 fictional rows: IDs, categories,</text>
<text x="38" y="95.2" font-size="16" fill="#A9AEB5" data-box="24,20,372,92">quantities, dates</text>
<path d="M210 112 L210 140" fill="none" stroke="#848D98" stroke-width="2" marker-end="url(#m-line)"/>
<rect x="24" y="144" width="372" height="136" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="38" y="173.2" font-size="19" fill="#E9E7E2" font-weight="700" data-box="24,144,372,136">Row checks</text>
<text x="38" y="198.2" font-size="16" fill="#A9AEB5" data-box="24,144,372,136">trim whitespace</text>
<text x="38" y="219.2" font-size="16" fill="#A9AEB5" data-box="24,144,372,136">exact category aliases</text>
<text x="38" y="240.2" font-size="16" fill="#A9AEB5" data-box="24,144,372,136">ID, quantity and date rules</text>
<path d="M120 280 L120 336" fill="none" stroke="#6FCDC2" stroke-width="2" marker-end="url(#m-ok)"/>
<path d="M300 280 L300 336" fill="none" stroke="#E6B15C" stroke-width="2" marker-end="url(#m-warn)"/>
<text x="130" y="314" font-size="16" fill="#6FCDC2" font-weight="700">pass</text>
<text x="310" y="314" font-size="16" fill="#E6B15C" font-weight="700">fail</text>
<rect x="24" y="340" width="178" height="112" rx="10" fill="#16302D" stroke="#6FCDC2" stroke-width="1.5"/>
<text x="38" y="369.2" font-size="19" fill="#E9E7E2" font-weight="700" data-box="24,340,178,112">Accepted</text>
<text x="38" y="394.2" font-size="16" fill="#A9AEB5" data-box="24,340,178,112">37 canonical</text>
<text x="38" y="415.2" font-size="16" fill="#A9AEB5" data-box="24,340,178,112">rows</text>
<rect x="218" y="340" width="178" height="112" rx="10" fill="#33290F" stroke="#E6B15C" stroke-width="1.5"/>
<text x="232" y="369.2" font-size="19" fill="#E9E7E2" font-weight="700" data-box="218,340,178,112">Exceptions</text>
<text x="232" y="394.2" font-size="16" fill="#A9AEB5" data-box="218,340,178,112">23 rows held</text>
<text x="232" y="415.2" font-size="16" fill="#A9AEB5" data-box="218,340,178,112">for review</text>
<text x="24" y="492" font-size="16" fill="#A9AEB5">No fuzzy matching: an ambiguous</text>
<text x="24" y="513" font-size="16" fill="#A9AEB5">category is reviewed, never guessed.</text>
</g></svg>
