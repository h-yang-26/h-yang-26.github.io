<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="440" height="520" role="img" aria-labelledby="t"><title id="t">Is a pressure unit a pump or a sensor? Ambiguous rows go to human review.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7D8691"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A0C"/></marker></defs><rect width="440" height="520" rx="18" fill="#FFFFFF"/><g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="28" y="46" font-size="17" fill="#1C5785" font-weight="800" letter-spacing="1.2">NARROWING AMBIGUITY</text>
<text x="28" y="92" font-size="29" fill="#1A1D21" font-weight="800" data-box="24,60,392,80">Is a “pressure unit”</text>
<text x="28" y="128" font-size="29" fill="#1A1D21" font-weight="800" data-box="24,60,392,80">a pump or a sensor?</text>
<text x="28" y="446" font-size="18" fill="#4F5660" data-box="24,424,392,86">The data can’t decide, so I don’t guess.</text>
<text x="28" y="471" font-size="18" fill="#4F5660" data-box="24,424,392,86">Ambiguous rows go to a person, never</text>
<text x="28" y="496" font-size="18" fill="#4F5660" data-box="24,424,392,86">silently into the system.</text>
<path d="M146 150 h144 a10 10 0 0 1 10 10 v24 a10 10 0 0 1 -10 10 h-144 l-22 -22 z" fill="#FBF1DE" stroke="#8A5A0C" stroke-width="2"/>
