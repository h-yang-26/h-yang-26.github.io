<circle cx="88" cy="270" r="4" fill="#1C5785"/>
<text x="88" y="326" font-size="18" fill="#1A1D21" font-weight="700" text-anchor="middle">Pump?</text>
<circle cx="344" cy="270" r="28" fill="#EAF1F7" stroke="#1C5785" stroke-width="2.5"/>
