<rect x="40" y="262" width="22" height="16" rx="3" fill="#EAF1F7" stroke="#1C5785" stroke-width="2"/>
<circle cx="88" cy="270" r="26" fill="#EAF1F7" stroke="#1C5785" stroke-width="2.5"/>
