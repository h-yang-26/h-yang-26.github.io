<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="t d"><title id="t">A constrained allocation decision</title><desc id="d">Inputs and shipping constraints enter an integer-programming model that returns allocations and shortages.</desc><rect x="0" y="0" width="1000" height="475" rx="0" fill="#F5F8FB" stroke="#F5F8FB" stroke-width="1.5"/><rect x="0" y="0" width="1000" height="8" rx="3" fill="#23628D"/><text x="39" y="35" fill="#167D78" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start">01 / OPTIMIZATION</text><text x="39" y="78" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" text-anchor="start">A constrained allocation decision</text><rect x="37" y="146" width="239" height="112" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="37" y="146" width="5" height="112" rx="3" fill="#23628D"/><text x="54" y="184" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Product inputs</text><text x="54" y="211" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">stock · demand · penalty</text><text x="54" y="231" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">unit mass / volume</text><rect x="37" y="290" width="239" height="107" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="37" y="290" width="5" height="107" rx="3" fill="#23628D"/><text x="54" y="328" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Container inputs</text><text x="54" y="355" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">kg + m³ capacity</text><text x="54" y="375" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">fixed opening charge</text><rect x="368" y="166" width="298" height="175" rx="12" fill="#FFFFFF" stroke="#167D78" stroke-width="1.5"/><rect x="368" y="166" width="5" height="175" rx="3" fill="#167D78"/><text x="385" y="204" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Integer program</text><text x="385" y="231" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">x = allocated units</text><text x="385" y="251" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">u = shortage units</text><text x="385" y="271" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">y = opened containers</text><rect x="772" y="142" width="196" height="109" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="772" y="142" width="5" height="109" rx="3" fill="#23628D"/><text x="789" y="180" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Decision</text><text x="789" y="207" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">allocation + usage</text><rect x="772" y="281" width="196" height="112" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="772" y="281" width="5" height="112" rx="3" fill="#23628D"/><text x="789" y="319" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Feasibility</text><text x="789" y="346" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">mass · volume</text><text x="789" y="366" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">demand balance</text><path d="M276 204 L359 221" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M350 216 L359 221 L350 226" fill="none" stroke="#23628D" stroke-width="2.5" stroke-linecap="round"/><path d="M276 343 L334 343" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M334 343 L334 279" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M334 279 L359 279" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M350 274 L359 279 L350 284" fill="none" stroke="#23628D" stroke-width="2.5" stroke-linecap="round"/><path d="M666 217 L761 194" fill="none" stroke="#167D78" stroke-width="3" stroke-linecap="round"/><path d="M752 189 L761 194 L752 199" fill="none" stroke="#167D78" stroke-width="2.5" stroke-linecap="round"/><path d="M666 290 L761 337" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M752 332 L761 337 L752 342" fill="none" stroke="#23628D" stroke-width="2.5" stroke-linecap="round"/><text x="505" y="426" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">Minimize shortage penalties + container-opening charges</text><path d="M40 428 L960 428" fill="none" stroke="#D7E3ED" stroke-width="3" stroke-linecap="round"/><text x="40" y="455" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Mass/volume feasibility only — no 3D packing or load-restraint model.</text></svg>
