<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t">
<title id="t">Integer program with an independent checker</title>
<defs>
<marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7D8691"/></marker>
</defs>
<rect width="760" height="330" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect x="24" y="24" width="200" height="132" rx="10" fill="#F4F6F8" stroke="#7D8691" stroke-width="1.5"/>
<text x="38" y="52.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="24,24,200,132">Products</text>
<text x="38" y="75.4" font-size="15" fill="#4F5660" data-box="24,24,200,132">stock and demand</text>
<text x="38" y="95.4" font-size="15" fill="#4F5660" data-box="24,24,200,132">shortage penalty</text>
<text x="38" y="115.4" font-size="15" fill="#4F5660" data-box="24,24,200,132">unit mass, volume</text>
<rect x="24" y="178" width="200" height="106" rx="10" fill="#F4F6F8" stroke="#7D8691" stroke-width="1.5"/>
<text x="38" y="206.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="24,178,200,106">Containers</text>
<text x="38" y="229.4" font-size="15" fill="#4F5660" data-box="24,178,200,106">mass and volume limits</text>
<text x="38" y="249.4" font-size="15" fill="#4F5660" data-box="24,178,200,106">fixed opening charge</text>
<rect x="264" y="64" width="254" height="180" rx="10" fill="#EAF1F7" stroke="#1C5785" stroke-width="1.5"/>
<text x="278" y="92.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="264,64,254,180">Integer program</text>
<text x="278" y="115.4" font-size="15" fill="#4F5660" data-box="264,64,254,180">decides units per container,</text>
<text x="278" y="135.4" font-size="15" fill="#4F5660" data-box="264,64,254,180">short units and which</text>
<text x="278" y="155.4" font-size="15" fill="#4F5660" data-box="264,64,254,180">containers open</text>
<text x="278" y="184.4" font-size="15" fill="#4F5660" data-box="264,64,254,180">minimizes shortage penalties</text>
<text x="278" y="204.4" font-size="15" fill="#4F5660" data-box="264,64,254,180">+ opening charges</text>
<rect x="572" y="76" width="164" height="156" rx="10" fill="#E3F2F0" stroke="#146C67" stroke-width="1.5"/>
<text x="586" y="104.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="572,76,164,156">Checker</text>
<text x="586" y="127.4" font-size="15" fill="#4F5660" data-box="572,76,164,156">re-verifies limits,</text>
<text x="586" y="147.4" font-size="15" fill="#4F5660" data-box="572,76,164,156">integers and cost</text>
<text x="586" y="176.4" font-size="15" fill="#4F5660" data-box="572,76,164,156">OPTIMAL only if</text>
<text x="586" y="196.4" font-size="15" fill="#4F5660" data-box="572,76,164,156">both agree</text>
<path d="M224 90 L242 90 L242 130 L260 130" fill="none" stroke="#7D8691" stroke-width="2" marker-end="url(#m-line)"/>
<path d="M224 231 L242 231 L242 178 L260 178" fill="none" stroke="#7D8691" stroke-width="2" marker-end="url(#m-line)"/>
<path d="M518 154 L568 154" fill="none" stroke="#7D8691" stroke-width="2" marker-end="url(#m-line)"/>
<text x="543" y="142" font-size="15" fill="#4F5660" font-weight="700" text-anchor="middle">plan</text>
<text x="24" y="314" font-size="15" fill="#4F5660">Mass and volume feasibility only: not a 3D packing or load-restraint plan.</text>
</g></svg>
