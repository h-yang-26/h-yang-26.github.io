<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="475" viewBox="0 0 1000 475" role="img" aria-labelledby="t d"><title id="t">From quote to physical shipment</title><desc id="d">Four units quoted: two become an order. One is shipped and one remains. Two quoted units are not converted to orders.</desc><rect x="0" y="0" width="1000" height="475" rx="0" fill="#F5F8FB" stroke="#F5F8FB" stroke-width="1.5"/><rect x="0" y="0" width="1000" height="8" rx="3" fill="#23628D"/><text x="39" y="35" fill="#167D78" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" text-anchor="start">02 / B2B SYSTEMS</text><text x="39" y="78" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="30" font-weight="750" text-anchor="start">From quote to physical shipment</text><text x="40" y="132" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650" text-anchor="start">Quantities are nested business states, not four additive demand buckets.</text><rect x="35" y="169" width="208" height="108" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="35" y="169" width="5" height="108" rx="3" fill="#23628D"/><text x="52" y="207" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Quote: 4</text><text x="52" y="234" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">commercial offer</text><rect x="305" y="169" width="210" height="108" rx="12" fill="#FFFFFF" stroke="#167D78" stroke-width="1.5"/><rect x="305" y="169" width="5" height="108" rx="3" fill="#167D78"/><text x="322" y="207" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Order: 2</text><text x="322" y="234" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">accepted commitment</text><rect x="580" y="169" width="193" height="108" rx="12" fill="#FFFFFF" stroke="#23628D" stroke-width="1.5"/><rect x="580" y="169" width="5" height="108" rx="3" fill="#23628D"/><text x="597" y="207" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Shipped: 1</text><text x="597" y="234" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">physical fulfillment</text><rect x="771" y="330" width="199" height="91" rx="12" fill="#FFFFFF" stroke="#AA721D" stroke-width="1.5"/><rect x="771" y="330" width="5" height="91" rx="3" fill="#AA721D"/><text x="788" y="368" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Remaining: 1</text><text x="788" y="395" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">ordered − shipped</text><rect x="305" y="330" width="210" height="91" rx="12" fill="#FFFFFF" stroke="#AA721D" stroke-width="1.5"/><rect x="305" y="330" width="5" height="91" rx="3" fill="#AA721D"/><text x="322" y="368" fill="#122B43" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750" text-anchor="start">Unconverted: 2</text><text x="322" y="395" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">quote only; not backlog</text><path d="M243 222 L297 222" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M288 217 L297 222 L288 227" fill="none" stroke="#23628D" stroke-width="2.5" stroke-linecap="round"/><path d="M515 222 L572 222" fill="none" stroke="#23628D" stroke-width="3" stroke-linecap="round"/><path d="M563 217 L572 222 L563 227" fill="none" stroke="#23628D" stroke-width="2.5" stroke-linecap="round"/><path d="M410 277 L410 323" fill="none" stroke="#AA721D" stroke-width="3" stroke-linecap="round"/><path d="M670 277 L670 375" fill="none" stroke="#AA721D" stroke-width="3" stroke-linecap="round"/><path d="M670 375 L763 375" fill="none" stroke="#AA721D" stroke-width="3" stroke-linecap="round"/><path d="M754 370 L763 375 L754 380" fill="none" stroke="#AA721D" stroke-width="2.5" stroke-linecap="round"/><path d="M40 428 L960 428" fill="none" stroke="#D7E3ED" stroke-width="3" stroke-linecap="round"/><text x="40" y="455" fill="#51667C" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="500" text-anchor="start">Source: b2b-sales-systems-case-study/examples/fictional-order-scenario.json.</text></svg>
