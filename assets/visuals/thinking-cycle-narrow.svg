<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" width="420" height="640" role="img" aria-labelledby="t">
<title id="t">Six reusable reasoning operations</title>
<defs>
<marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7D8691"/></marker>
</defs>
<rect width="420" height="640" fill="#FFFFFF"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect x="70" y="20" width="326" height="76" rx="10" fill="#EAF1F7" stroke="#1C5785" stroke-width="1.5"/>
<text x="84" y="48.4" font-size="16" fill="#1C5785" font-weight="700" data-box="70,20,326,76">01 · CLARIFY</text>
<text x="84" y="71.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="70,20,326,76">The decision</text>
