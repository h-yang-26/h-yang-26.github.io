<text x="84" y="432.4" font-size="16" fill="#1C5785" font-weight="700" data-box="70,404,326,76">05 · VALIDATE</text>
<text x="84" y="455.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="70,404,326,76">Assumptions, limits</text>
<path d="M233 480 L233 496" fill="none" stroke="#7D8691" stroke-width="2" marker-end="url(#m-line)"/>
