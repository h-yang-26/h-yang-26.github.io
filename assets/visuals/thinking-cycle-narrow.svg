<text x="84" y="144.4" font-size="16" fill="#1C5785" font-weight="700" data-box="70,116,326,76">02 · LOCATE</text>
<text x="84" y="167.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="70,116,326,76">The structure</text>
<path d="M233 192 L233 208" fill="none" stroke="#7D8691" stroke-width="2" marker-end="url(#m-line)"/>
