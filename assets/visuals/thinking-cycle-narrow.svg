<text x="84" y="528.4" font-size="16" fill="#1C5785" font-weight="700" data-box="70,500,326,76">06 · EXPLAIN</text>
<text x="84" y="551.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="70,500,326,76">What follows</text>
<path d="M70 534 L40 534 L40 58 L66 58" fill="none" stroke="#7D8691" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-line)"/>
<text x="24" y="612" font-size="16" fill="#4F5660">Dashed: new evidence can reopen any</text>
<text x="24" y="633" font-size="16" fill="#4F5660">earlier step. Not a guaranteed algorithm.</text>
