<text x="84" y="336.4" font-size="16" fill="#1C5785" font-weight="700" data-box="70,308,326,76">04 · INVESTIGATE</text>
<text x="84" y="359.4" font-size="18" fill="#1A1D21" font-weight="700" data-box="70,308,326,76">Models and evidence</text>
<path d="M233 384 L233 400" fill="none" stroke="#7D8691" stroke-width="2" marker-end="url(#m-line)"/>
