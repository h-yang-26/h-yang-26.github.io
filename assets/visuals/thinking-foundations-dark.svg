<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t">
<title id="t">Structure and justification inform one decision</title>
<defs>
<marker id="m-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#848D98"/></marker>
</defs>
<rect width="760" height="330" fill="#191C1F"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<rect x="24" y="24" width="330" height="140" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="38" y="52.4" font-size="15" fill="#8CC0EA" font-weight="700" data-box="24,24,330,140">APPLIED MATHEMATICS</text>
<text x="38" y="75.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="24,24,330,140">What structure</text>
<text x="38" y="98.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="24,24,330,140">is present?</text>
<text x="38" y="121.4" font-size="15" fill="#A9AEB5" data-box="24,24,330,140">variables, relationships,</text>
<text x="38" y="141.4" font-size="15" fill="#A9AEB5" data-box="24,24,330,140">constraints</text>
<rect x="406" y="24" width="330" height="140" rx="10" fill="#1D2A36" stroke="#8CC0EA" stroke-width="1.5"/>
<text x="420" y="52.4" font-size="15" fill="#8CC0EA" font-weight="700" data-box="406,24,330,140">PHILOSOPHY</text>
<text x="420" y="75.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="406,24,330,140">What justifies</text>
<text x="420" y="98.4" font-size="18" fill="#E9E7E2" font-weight="700" data-box="406,24,330,140">the conclusion?</text>
<text x="420" y="121.4" font-size="15" fill="#A9AEB5" data-box="406,24,330,140">assumptions, evidence,</text>
<text x="420" y="141.4" font-size="15" fill="#A9AEB5" data-box="406,24,330,140">uncertainty</text>
<path d="M189 164 L189 196 L330 196 L330 224" fill="none" stroke="#848D98" stroke-width="2" marker-end="url(#m-line)"/>
<path d="M571 164 L571 196 L430 196 L430 224" fill="none" stroke="#848D98" stroke-width="2" marker-end="url(#m-line)"/>
<rect x="200" y="228" width="360" height="84" rx="10" fill="#16302D" stroke="#6FCDC2" stroke-width="1.5"/>
<text x="380" y="256.4" font-size="18" fill="#E9E7E2" font-weight="700" text-anchor="middle" data-box="200,228,360,84">A practical decision</text>
<text x="380" y="279.4" font-size="15" fill="#A9AEB5" text-anchor="middle" data-box="200,228,360,84">domain knowledge + appropriate evidence</text>
</g></svg>
