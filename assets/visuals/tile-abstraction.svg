<text x="196" y="224" font-size="17" fill="#1A1D21" font-weight="800" text-anchor="end">82%</text>
<rect x="28" y="234" width="168" height="18" rx="9" fill="#E5EAEF"/>
<rect x="28" y="234" width="138" height="18" rx="9" fill="#1C5785"/>
