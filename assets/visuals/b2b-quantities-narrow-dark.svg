<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 497" width="420" height="497" role="img" aria-labelledby="t">
<title id="t">Quoted, ordered and shipped units for one fictional order</title>
<defs>
</defs>
<rect width="420" height="497" fill="#191C1F"/>
<g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<text x="24" y="40" font-size="18" fill="#E9E7E2" font-weight="700">Quoted</text>
<rect x="24" y="52" width="60" height="60" rx="8" fill="#8CC0EA"/>
<rect x="98" y="52" width="60" height="60" rx="8" fill="#8CC0EA"/>
<rect x="172" y="52" width="60" height="60" rx="8" fill="#8CC0EA"/>
<rect x="246" y="52" width="60" height="60" rx="8" fill="#8CC0EA"/>
<text x="24" y="136" font-size="16" fill="#A9AEB5">4 units offered</text>
<text x="24" y="172" font-size="18" fill="#E9E7E2" font-weight="700">Ordered</text>
<rect x="24" y="184" width="60" height="60" rx="8" fill="#8CC0EA"/>
<rect x="98" y="184" width="60" height="60" rx="8" fill="#8CC0EA"/>
<rect x="172" y="184" width="60" height="60" rx="8" fill="#191C1F" stroke="#848D98" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="246" y="184" width="60" height="60" rx="8" fill="#191C1F" stroke="#848D98" stroke-width="2" stroke-dasharray="6 4"/>
<text x="24" y="268" font-size="16" fill="#A9AEB5">2 committed, 2 not converted</text>
<text x="24" y="304" font-size="18" fill="#E9E7E2" font-weight="700">Shipped</text>
<rect x="24" y="316" width="60" height="60" rx="8" fill="#6FCDC2"/>
<rect x="98" y="316" width="60" height="60" rx="8" fill="#191C1F" stroke="#E6B15C" stroke-width="2" stroke-dasharray="6 4"/>
<text x="24" y="400" font-size="16" fill="#A9AEB5">1 shipped, 1 still owed</text>
<text x="24" y="434" font-size="16" fill="#A9AEB5">One square = one unit. Unconverted</text>
<text x="24" y="455" font-size="16" fill="#A9AEB5">quote units are not demand.</text>
<text x="24" y="476" font-size="16" fill="#A9AEB5">Remaining = ordered − shipped = 1.</text>
</g></svg>
