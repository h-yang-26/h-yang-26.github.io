<text x="196" y="224" font-size="17" fill="#E9E7E2" font-weight="800" text-anchor="end">82%</text>
<rect x="28" y="234" width="168" height="18" rx="9" fill="#2B3137"/>
<rect x="28" y="234" width="138" height="18" rx="9" fill="#8CC0EA"/>
