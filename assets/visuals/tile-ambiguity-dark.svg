<rect x="40" y="262" width="22" height="16" rx="3" fill="#1D2A36" stroke="#8CC0EA" stroke-width="2"/>
<circle cx="88" cy="270" r="26" fill="#1D2A36" stroke="#8CC0EA" stroke-width="2.5"/>
<rect x="80" y="234" width="16" height="12" rx="2" fill="#1D2A36" stroke="#8CC0EA" stroke-width="2"/>
