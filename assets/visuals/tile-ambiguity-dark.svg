<path d="M344 272 L358 254" stroke="#8CC0EA" stroke-width="3" stroke-linecap="round"/><circle cx="344" cy="272" r="4" fill="#8CC0EA"/>
<text x="344" y="326" font-size="18" fill="#E9E7E2" font-weight="700" text-anchor="middle">Sensor?</text>
<text x="216" y="284" font-size="50" fill="#E6B15C" font-weight="800" text-anchor="middle">?</text>
