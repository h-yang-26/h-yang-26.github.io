<circle cx="88" cy="270" r="4" fill="#8CC0EA"/>
<text x="88" y="326" font-size="18" fill="#E9E7E2" font-weight="700" text-anchor="middle">Pump?</text>
<circle cx="344" cy="270" r="28" fill="#1D2A36" stroke="#8CC0EA" stroke-width="2.5"/>
