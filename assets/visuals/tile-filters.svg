<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="440" height="520" role="img" aria-labelledby="t"><title id="t">Filters change the events in view, but the 31 rows not counted stay the same.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7D8691"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A5A0C"/></marker></defs><rect width="440" height="520" rx="18" fill="#FFFFFF"/><g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><text x="28" y="46" font-size="17" fill="#1C5785" font-weight="800" letter-spacing="1.2">EXAMINING EVIDENCE</text>
<text x="28" y="92" font-size="29" fill="#1A1D21" font-weight="800" data-box="24,60,392,80">Change the filters.</text>
<text x="28" y="128" font-size="29" fill="#1A1D21" font-weight="800" data-box="24,60,392,80">Do the facts change?</text>
<text x="28" y="446" font-size="18" fill="#4F5660" data-box="24,424,392,86">Filters change what you look at, not</text>
<text x="28" y="471" font-size="18" fill="#4F5660" data-box="24,424,392,86">what is true about the data. Validation</text>
<text x="28" y="496" font-size="18" fill="#4F5660" data-box="24,424,392,86">runs on the whole file first.</text>
<rect x="28" y="146" width="184" height="190" rx="14" fill="#F4F6F8" stroke="#7D8691" stroke-width="2"/>
